# Builds a Madeira 0.1.3 IPA with the Slay the Spire 2 fixes, without macOS:
# the official IPA with three rebuilt ARM64EC modules (madeira_d3d12/d3d12,
# dxgi, dcomp) and the two-instruction ntdll.dll patch. The signature of the
# result is broken by design; SideStore/AltStore/Sideloadly re-sign it.
name: StS2 IPA

on:
  push:
    branches: [sts2]
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_TAG: v0.1.3
  BASE_IPA: Madeira-0.1.3.ipa
  LLVM_MINGW: llvm-mingw-20260421-ucrt-ubuntu-22.04-x86_64
  DXMT_REPO: DAthensT/dxmt
  DXMT_REF: sts2-composition

jobs:
  ipa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DXMT_REPO }}
          ref: ${{ env.DXMT_REF }}
          path: dxmt-src
          fetch-depth: 0

      - name: Fetch llvm-mingw
        run: |
          curl -fsSL -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/${LLVM_MINGW}.tar.xz"
          tar -xf llvm-mingw.tar.xz

      - name: Build DLLs
        run: bash tools/sts2/build-dlls.sh "$PWD/$LLVM_MINGW/bin" dxmt-src out

      - name: Fetch the official IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BASE_TAG" --repo willfaust/Madeira -p "$BASE_IPA" -p "$BASE_IPA.sha256"
          sha256sum -c "$BASE_IPA.sha256"

      - name: Patch the IPA
        run: |
          IPA="Madeira-0.1.3-sts2-${GITHUB_SHA::7}.ipa"
          FARM=Payload/Madeira.app/arm64ec-windows
          cp "$BASE_IPA" "$IPA"
          mkdir -p stage/$FARM
          unzip -q "$BASE_IPA" "$FARM/ntdll.dll" -d stage
          python3 tools/sts2/patch-ntdll-heap-stp.py stage/$FARM/ntdll.dll
          cp out/madeira_d3d12.dll out/d3d12.dll out/dcomp.dll out/dxgi.dll stage/$FARM/
          (cd stage && zip -q "../$IPA" $FARM/ntdll.dll $FARM/madeira_d3d12.dll $FARM/d3d12.dll $FARM/dcomp.dll $FARM/dxgi.dll)
          unzip -l "$IPA" | grep -E "$FARM/(ntdll|madeira_d3d12|d3d12|dcomp|dxgi)\.dll"
          sha256sum "$IPA" | tee "$IPA.sha256"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          # A/B variant: only the ntdll.dll patch, every other module as shipped.
          NTDLL_IPA="Madeira-0.1.3-sts2-ntdll-only-${GITHUB_SHA::7}.ipa"
          cp "$BASE_IPA" "$NTDLL_IPA"
          (cd stage && zip -q "../$NTDLL_IPA" $FARM/ntdll.dll)
          sha256sum "$NTDLL_IPA" | tee "$NTDLL_IPA.sha256"
          echo "NTDLL_IPA=$NTDLL_IPA" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: |
            ${{ env.IPA }}
            ${{ env.NTDLL_IPA }}

      - name: Publish a release in this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sts2-${GITHUB_SHA::7}"
          gh release create "$TAG" "$IPA" "$IPA.sha256" "$NTDLL_IPA" "$NTDLL_IPA.sha256" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "Madeira 0.1.3 + StS2 fixes (${GITHUB_SHA::7})" \
            --notes "$IPA: official Madeira 0.1.3 IPA with madeira_d3d12/d3d12, dxgi and dcomp rebuilt from this commit and DXMT ${DXMT_REF}, and ntdll.dll patched (tools/sts2/patch-ntdll-heap-stp.py). $NTDLL_IPA: only the ntdll.dll patch (A/B). Re-sign when sideloading."
