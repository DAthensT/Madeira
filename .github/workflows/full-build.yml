# Full rebuild of Madeira's app executable (native libraries + Swift app) on a
# macOS runner, put into the official 0.1.1 IPA together with the StS2 DLLs.
# Each stage is its own step and keeps going after a failure, so one run shows
# every broken stage; the "Check" step fails the job if any stage failed.
name: Full build

# Runs on a push to sts2-full (git push fork sts2:sts2-full): workflow_dispatch
# needs the workflow on the fork's default branch, which is left untouched.
on:
  push:
    branches: [sts2-full]
  workflow_dispatch:

permissions:
  contents: write

env:
  XCODE: latest-stable
  LLVM_CACHE_KEY: llvm-ios-15.0.7-v1
  BASE_TAG: v0.1.1
  BASE_IPA: Madeira-0.1.1.ipa

jobs:
  llvm:
    runs-on: macos-26
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE }}
      - id: cache
        uses: actions/cache@v4
        with:
          key: ${{ env.LLVM_CACHE_KEY }}
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib/*.a
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install ninja >/dev/null
          bash tools/ci/build-llvm-ios.sh

  build:
    needs: llvm
    runs-on: macos-26
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: DAthensT/dxmt
          ref: sts2-composition
          path: dxmt-sts2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE }}
      - uses: actions/cache/restore@v4
        with:
          key: ${{ env.LLVM_CACHE_KEY }}
          fail-on-cache-miss: true
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib/*.a

      - name: toolchains
        run: bash tools/ci/full-build.sh toolchains
      - name: gnutls
        id: gnutls
        continue-on-error: true
        run: bash tools/ci/full-build.sh gnutls
      - name: ffmpeg
        id: ffmpeg
        continue-on-error: true
        run: bash tools/ci/full-build.sh ffmpeg
      - name: freetype
        id: freetype
        continue-on-error: true
        run: bash tools/ci/full-build.sh freetype
      - name: wine-macos
        id: wine-macos
        continue-on-error: true
        run: bash tools/ci/full-build.sh wine-macos
      - name: wine-arm64ec
        id: wine-arm64ec
        continue-on-error: true
        run: bash tools/ci/full-build.sh wine-arm64ec
      - name: ntdll
        id: ntdll
        continue-on-error: true
        run: bash tools/ci/full-build.sh ntdll
      - name: win32u
        id: win32u
        continue-on-error: true
        run: bash tools/ci/full-build.sh win32u
      - name: wineserver
        id: wineserver
        continue-on-error: true
        run: bash tools/ci/full-build.sh wineserver
      - name: fex
        id: fex
        continue-on-error: true
        run: bash tools/ci/full-build.sh fex
      - name: dxmt
        id: dxmt
        continue-on-error: true
        run: bash tools/ci/full-build.sh dxmt
      - name: app
        id: app
        continue-on-error: true
        run: bash tools/ci/full-build.sh app

      - name: StS2 DLLs
        id: dlls
        continue-on-error: true
        run: bash tools/sts2/build-dlls.sh "$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin" dxmt-sts2 out-dlls

      - name: IPA
        id: ipa
        if: steps.app.outcome == 'success' && steps.dlls.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BASE_TAG" --repo willfaust/Madeira -p "$BASE_IPA" -p "$BASE_IPA.sha256"
          shasum -a 256 -c "$BASE_IPA.sha256"
          IPA="Madeira-0.1.1-full-${GITHUB_SHA::7}.ipa"
          bash tools/ci/full-build.sh ipa "$BASE_IPA" "$IPA" out-dlls
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p ci-logs
          for d in build/*/obj build/dxmt-ios/obj; do
            [ -d "$d" ] && find "$d" \( -name '*.err' -o -name 'err-*.txt' \) -size +0 -exec cp {} ci-logs/ \; || true
          done
          cp build/xcodebuild.log ci-logs/ 2>/dev/null || true
          cp wine/build-macos/config.log ci-logs/wine-macos-config.log 2>/dev/null || true
          cp wine/build-arm64ec/config.log ci-logs/wine-arm64ec-config.log 2>/dev/null || true
          cp build/ffmpeg/obj/configure.log ci-logs/ffmpeg-configure.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: ci-logs
      - uses: actions/upload-artifact@v4
        if: steps.ipa.outcome == 'success'
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}
      - name: Publish a release in this fork
        if: steps.ipa.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "full-${GITHUB_SHA::7}" "$IPA" "$IPA.sha256" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "Madeira 0.1.1 full build + StS2 (${GITHUB_SHA::7})" \
            --notes "App executable rebuilt from this commit (Mach store emulator: GPR STP writeback, LSE atomics) inside the official 0.1.1 IPA, with madeira_d3d12/d3d12, dxgi and dcomp from tools/sts2/build-dlls.sh. Re-sign when sideloading."

      - name: Check
        if: always()
        run: |
          echo "gnutls=${{ steps.gnutls.outcome }} ffmpeg=${{ steps.ffmpeg.outcome }} freetype=${{ steps.freetype.outcome }}"
          echo "wine-macos=${{ steps.wine-macos.outcome }} wine-arm64ec=${{ steps.wine-arm64ec.outcome }}"
          echo "ntdll=${{ steps.ntdll.outcome }} win32u=${{ steps.win32u.outcome }} wineserver=${{ steps.wineserver.outcome }}"
          echo "fex=${{ steps.fex.outcome }} dxmt=${{ steps.dxmt.outcome }} app=${{ steps.app.outcome }} dlls=${{ steps.dlls.outcome }} ipa=${{ steps.ipa.outcome }}"
          [ "${{ steps.ipa.outcome }}" = success ]
